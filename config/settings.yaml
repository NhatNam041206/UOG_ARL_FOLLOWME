camera_index: 2
input_resolution:
- 640
- 480
camera_fov_horizontal_deg: 60.0  # CẦN xác nhận FOV thực tế của webcam đang dùng, đây là giá trị mẫu
flip_horizontal: true  # Lật ngang khung hình nếu webcam cho hình bị mirror ngược ý muốn

yolo_model_path: yolo11n.onnx
detection_imgsz:  # PLACEHOLDER, để trống = mặc định ultralytics (640). Hạ xuống 416/320 đổi lấy tốc độ trên CPU/RPi5, đánh đổi recall/độ chính xác định vị bbox ở người xa camera — xem README phần "Hiệu năng".
osnet_variant: osnet_x1_0  # "osnet_x1_0" (Market1501, baseline, Rank-1 94.2/mAP 82.6), "osnet_x0_75" (93.7/81.2), "osnet_x0_5" (92.5/79.8), "osnet_x0_25" (91.2/75.0, nhẹ nhất — ~9% mAP thấp hơn baseline, xem README phần "Hiệu năng" trước khi đổi), hoặc "osnet_ain_x1_0" (cross-domain, xem comment trong src/verifier.py)
similarity_threshold: 0.80  # PLACEHOLDER — giữ nguyên giá trị cũ từ thời MobileNetV3, CHƯA calibrate lại cho OSNet (phân phối similarity của 2 model khác nhau, xem Scenario A/B mới)
verify_every_n_frames: 1  # 1 = verify mọi track mỗi frame (mặc định, hành vi cũ). >1: track KHÔNG phải active target chỉ được OSNet+pose re-verify mỗi N frame, các frame giữa dùng lại raw_score gần nhất (ByteTrack tự giữ track_id) — giảm trực tiếp N lần chi phí OSNet cho các track không phải mục tiêu. Active target và track mới xuất hiện LUÔN được verify mỗi frame bất kể giá trị này. Xem README phần "Hiệu năng".

roi_percent:
- 0.302
- 0.0
- 0.715
- 1.0
registration_countdown_sec: 3
registration_duration_sec: 8
registration_sample_interval_frames: 5
registration_min_samples: 5

# Dynamic ROI-constrained YOLO detection (chỉ áp dụng khi đã có active target sticky-tracked)
roi_margin_percent: 0.5        # PLACEHOLDER — cần calibrate. Mở rộng ROI thêm % kích thước bbox target frame trước, mỗi chiều.
roi_failure_max_frames: 5      # PLACEHOLDER — cần calibrate. Số frame ROI thất bại liên tiếp trước khi ép quét lại toàn frame.

# Aspect ratio hard gate (độc lập với similarity ngoại hình, chống nhầm người mặc đồ giống nhau)
aspect_ratio_tolerance_percent: 0.30  # PLACEHOLDER — cần calibrate bằng dữ liệu thực tế, 30% là điểm khởi đầu rộng.

# Temporal smoothing settings for target verification (applies ONLY to identical track_ids across consecutive frames)
verification_smoothing:
  mode: "ema"                    # "ema" hoặc "voting" (bắt buộc 1 trong 2 giá trị này)
  ema_alpha: 0.3                 # PLACEHOLDER — cần calibrate bằng dữ liệu thực tế. Alpha nhỏ = mượt hơn nhưng trễ hơn.
  voting_window_size: 5          # PLACEHOLDER — cần calibrate bằng dữ liệu thực tế. Số frame trong cửa sổ trượt.
  voting_ratio: 0.6              # PLACEHOLDER — cần calibrate bằng dữ liệu thực tế. Tỷ lệ frame PASS tối thiểu để confirm.
  voting_min_ready_percent: 0.6  # PLACEHOLDER — cần calibrate. % của voting_window_size cần đạt trước khi tin vote_ratio.

# --- Quick Demo Spec: Wave + Facing Trigger Gate (demo_wave_trigger.py) ---
# TẤT CẢ giá trị dưới đây là PLACEHOLDER, CHƯA calibrate bằng dữ liệu thực (xem
# document/implementation/followme/Project_Master_Doc.md muc 7). Không dùng cho production.
wave_trigger_demo:
  pose_model_url: "https://tfhub.dev/google/movenet/singlepose/lightning/4"
  threshold_keypoint_conf_wave: 0.1    # PLACEHOLDER — gates wrist keypoint confidence for wave detection (shoulder no longer read here, see wave_horizontal_margin_percent below). Tunable independently of facing.
  threshold_keypoint_conf_facing: 0.3  # PLACEHOLDER — raised back from 0.1 (was too lenient: MoveNet keeps reporting moderate, non-near-zero confidence for a partially-turned/occluded eye, so 0.1 barely filtered anything and is_facing_camera stayed True even when turned away). Re-check live before tightening further.
  wave_buffer_size: 20           # PLACEHOLDER (N frame) — ~0.6-1s @ 20-30fps, cần đo lại theo fps thực tế.
  wave_direction_changes_min: 3  # PLACEHOLDER — chưa có cơ sở thực nghiệm.
  wave_amplitude_norm_min: 0.05  # PLACEHOLDER — chưa có cơ sở thực nghiệm, normalized theo input 192x192 (letterboxed).
  max_consecutive_bad_frames: 5  # PLACEHOLDER — theo tiền lệ roi_failure_max_frames ở trên.

  # Posture gate (muc 4.1), redesigned: geometry-based instead of shoulder-confidence-gated —
  # wrist must be above the crop's own vertical midline (fixed 50%, see src/wave_detector.py's
  # _BODY_MIDLINE_FRACTION) AND within the crop's own width (plus this tunable margin), instead
  # of being compared against the shoulder keypoint's position/confidence. Only wrist_conf (via
  # threshold_keypoint_conf_wave above) still gates reliability — shoulder is no longer read here.
  wave_horizontal_margin_percent: 0.1  # PLACEHOLDER — outer sanity bound: tolerance beyond each bbox edge, as a fraction of crop width. Not the wave-zone bound — see the min/max pair below for that.
  # Wave-zone BAND (fraction of crop width, distance from horizontal center): wrist must fall
  # between these two to count as "raised." min excludes touching/scratching the head or face
  # (confirmed bug: wrist near body center was passing with no floor); max excludes a full
  # sideways arm extension (confirmed bug: fixed previously). Watch the live overlay comparing a
  # real wave vs. touching your head vs. extending your arm fully to find the right band.
  wave_min_horizontal_extent_percent: 0.10  # PLACEHOLDER
  wave_max_horizontal_extent_percent: 0.35  # PLACEHOLDER
  wave_not_raised_reset_frames: 10  # PLACEHOLDER — frames the arm may stay lowered before the wave buffer is cleared. Fixes a confirmed bug: a deque(maxlen=N) only evicts on new pushes, so lowering the arm (no new pushes) froze stale oscillation history in the buffer and left is_waving stuck True indefinitely after the person actually stopped waving.
  facing_shoulder_ratio_min: 0.5  # PLACEHOLDER — min (shoulder width / shoulder-to-hip height), both in crop pixels. Fixes a confirmed bug: is_facing_camera stayed True when the torso turned left/right with the head still toward the camera, because confidence alone can't detect body orientation. Watch shoulder_torso_ratio on the live overlay facing forward vs. turned to find the right cutoff.
  log_csv_path: "logs/wave_trigger_demo_log.csv"  # per-frame CSV: trigger state + per-module timing (detect/verify/lock/pose/gesture/overlay/total ms). Written every run, both modes.

  # --any-person mode only: sticky lock + pluggable re-acquisition strategy, so the demo doesn't
  # jump between simultaneously-present people just because bbox sizes cross over. See
  # src/any_person_tracker.py. All 4 methods are selectable at runtime for A/B'ing performance
  # (e.g. on Raspberry Pi 5) via this config or the --reacquisition-method CLI override.
  any_person_tracking:
    reacquisition_method: "position"     # largest_bbox | position | histogram | osnet — cost/robustness increases in that order.
    lock_grace_frames: 5                 # PLACEHOLDER — frames the locked target may be briefly missing before re-acquisition triggers (theo tiền lệ max_consecutive_bad_frames ở trên).
    histogram_similarity_min: 0.5        # PLACEHOLDER — min HSV-histogram similarity (method="histogram") to accept a re-acquisition candidate; below this, falls back to largest_bbox.
    osnet_similarity_min: 0.5            # PLACEHOLDER — min OSNet cosine similarity (method="osnet") to accept a re-acquisition candidate; below this, falls back to largest_bbox.
