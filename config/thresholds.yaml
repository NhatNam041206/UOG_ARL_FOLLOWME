# Every value below: what it means, its calibration status, and how to tune it — see
# docs/parameters.md. `null` = deliberately uncalibrated (module fails closed); see that doc's
# status legend (🔴/🟡/🟢) before changing anything here.

# Sole collision-avoidance layer (modules/emergency_stop) — all keys required; see
# docs/parameters.md#emergency_stop.
emergency_stop:
  yolo_model_path: "models/yolo11n.onnx"

  runway_left_line: null
  runway_right_line: null
  roi_buffer_px: null

  size_prefilter_width_px: null
  size_prefilter_height_px: null

  zone_far_boundary: null
  zone_mid_boundary: null
  t_mid_seconds: null

  min_detection_confidence: null

  resume_buffer_seconds: null

# Used by main.py (--mode camera) and followme_orchestrator.SteeringController — see
# docs/parameters.md#camera.
camera:
  camera_index: 2
  fov_degrees: 85.0
  lens_type: "hybrid"
  focus_type: "fixed"

# PID steering (followme_orchestrator.SteeringController) — see docs/parameters.md#steering-plans08--followme_orchestratorsteeringcontroller.
steering:
  kp: 1.0
  ki: 0.5
  kd: 0.5
  max_steering_angle_degrees: 45.0
  servo_center_degrees: 90.0

# Standalone detector used internally by target_tracking/target_recovery — see
# docs/parameters.md#human_detection.
human_detection:
  yolo_model_path: "models/yolo11n.onnx"
  confidence_threshold: 0.5

# Face detect + match, plans/01 — see docs/parameters.md#face_identity-plans01--first-stage-of-the-face-first-pipeline.
face_identity:
  # yunet_model_path: "modules/face_identity/models/face_detection_yunet_2023mar.onnx"
  # edgeface_model_path: "modules/face_identity/models/edgeface_xs_gamma_06.onnx"
  # registry_dir: "modules/face_identity/registry_data"
  similarity_threshold_face_match: 0.4
  face_detection_confidence_threshold: 0.6

# ROI-scoped human detection, plans/02 — see docs/parameters.md#human_detection_roi-plans02--second-stage.
human_detection_roi:
  yolo_model_path: "models/yolo11n.onnx"
  roi_expansion_factor: 10.0
  roi_upward_fraction: 0.04
  roi_width_fraction: 0.8
  detection_confidence_threshold: 0.5

# Gesture Detection — Hand Keypoint, the sole TRIGGER gesture method, plans/03 — see
# docs/parameters.md#gesture_hand_keypoint-plans03--the-sole-trigger-gesture-method.
gesture_hand_keypoint:
  # model_path: "modules/gesture_hand_keypoint/models/hand_landmarker.task"
  confidence_threshold: 0.5
  min_fingers_extended_open: 4
  min_fingers_curled_closed: 4
  thumb_extension_ratio_threshold: 0.6
  palm_height_fraction: 0.5
  max_transition_gap_seconds: 1.5
  confirmation_duration_seconds: 1.0

# modules.appearance_verifier (plans/05) — REMOVED 2026-08-27, dead code never wired into any
# live pipeline (torchreid/gdown, its only dependents, were pulled from requirements.txt for the
# same reason — see docs/technologies.md).

# modules.target_tracking/modules.target_recovery (plans/06, plans/07) — REMOVED 2026-08-26,
# fully superseded by autocar below (see docs/parameters.md's autocar section for the one
# capability with no replacement: no periodic re-verify while a track_id stays locked).

# Vendored tracking+recovery backbone (modules/autocar) — see
# docs/parameters.md#autocar-vendored-tracking--recovery-backbone-replaces-target_trackingtarget_recovery-above
# for what changed in their commit 8037862, and the reid_head_split_fallback_fraction override gap.
autocar:
  detect_conf: 0.4
  detect_imgsz: 320
  # pose_model_path: "yolov8n-pose.pt"

  track_high_thresh: 0.6
  track_low_thresh: 0.1
  new_track_thresh: 0.7
  match_thresh: 0.8
  low_match_thresh: 0.5
  track_buffer: 30

  face_similarity_threshold: 0.363
  back_head_similarity_threshold: 0.7
  reid_head_split_fallback_fraction: 0.35
  reid_acquire_rounds: 3
  reid_acquire_cooldown_sec: 0.5
  # reid_model_path: "modules/autocar/models/osnet_x1_0_msmt17.onnx"
  # face_detector_model_path: "modules/autocar/models/face_detection_yunet_2023mar.onnx"
  # face_recognizer_model_path: "modules/autocar/models/face_recognition_sface_2021dec.onnx"

  recovery_timeout_seconds: null  # ours, not theirs — see docs/parameters.md

# MQTT drive-command publisher (Rasp 5 -> Pi 4 motor controller) — see
# docs/parameters.md#mqtt_bridge and docs/mqtt_handoff_pi4.md for the Pi 4 subscriber's copy of
# the wire contract. Reuses steering.servo_center_degrees (above) for the "stopped" angle;
# does NOT duplicate it here.
mqtt_bridge:
  broker_host: null          # REQUIRED — Pi 4's IP address on the shared network. Fail-closed
                              # while null: configure() logs a warning, publish() always returns
                              # False without attempting to connect.
  broker_port: 1883
  topic: "car/raspi5/control"
  publish_hz: 15           # REQUIRED, uncalibrated — starting range discussed: 5-15 Hz. Must be
                              # empirically tuned against real servo response + network latency on
                              # actual hardware, not assumed.

# register_person.py's capture ROI — see docs/parameters.md#register_person-register_personpy--not-a-per-frame-pipeline-module.
register_person:
  front_roi_percent: [0.20, 0.05, 0.80, 0.95]
  back_roi_percent: [0.15, 0.0, 0.85, 1.0]
