# All values under `emergency_stop:` are PLACEHOLDERS — see modules/emergency_stop's spec
# (Emergency Stop Module — Demo Implementation Spec). They have NOT been calibrated against real
# hardware/camera data and MUST NOT be treated as validated defaults. Until every key below is
# filled in with a real, measured value, modules.emergency_stop.interface.EmergencyStopModule
# refuses to ever output GO — it holds EStopDecision.UNCERTAIN (STOP-equivalent) on every frame
# and names the missing keys in EStopOutput.reason. This is intentional: operating the sole
# collision-avoidance layer on guessed numbers is unsafe, so "not yet calibrated" degrades to
# "always stopped," never to a silent default.
emergency_stop:
  # Optional — model weights path for this module's own standalone YOLO instance. Not a
  # threshold, has a working default (yolo11n.onnx at repo root); uncomment only to override.
  # yolo_model_path: "yolo11n.onnx"

  # --- ROI crop (spec §3.1) ---
  # Runway edges as two straight, frame-relative lines (NOT curved, no bird's-eye/IPM transform,
  # no steering-angle skew — see known limitations in modules/emergency_stop/roi.py). Each line
  # is [[x_top_frac, y_top_frac], [x_bottom_frac, y_bottom_frac]] — two endpoints, normalized
  # 0.0-1.0 fractions of frame width/height (0,0 = top-left corner). Together the two lines form
  # a trapezoid/triangle ahead of the robot, narrow end toward the far/top of frame.
  runway_left_line: null   # PLACEHOLDER — requires empirical calibration, e.g. [[0.40, 0.35], [0.10, 1.0]]
  runway_right_line: null  # PLACEHOLDER — requires empirical calibration, e.g. [[0.60, 0.35], [0.90, 1.0]]
  # Pixels added on the left/right of the runway trapezoid's bounding rectangle when cropping the
  # ROI fed to detection. Exists only so the detector isn't starved by a razor-tight crop
  # clipping bboxes at the edge — it does NOT loosen the runway-membership test itself (that
  # always uses the exact, unbuffered trapezoid edges — see roi.py's docstring on this).
  roi_buffer_px: null       # PLACEHOLDER — requires empirical calibration

  # --- Size pre-filter (spec §3.3) ---
  size_prefilter_width_px: null   # PLACEHOLDER — requires empirical calibration
  size_prefilter_height_px: null  # PLACEHOLDER — requires empirical calibration

  # --- Three-zone runway logic (spec §3.4) ---
  # The runway is sliced along its length by two y-fraction dividers, in the SAME full-frame
  # normalized 0.0-1.0 coordinate space as the runway lines above (0 = top/far, 1 = bottom/near).
  # far zone:  [runway top, zone_far_boundary)
  # mid zone:  [zone_far_boundary, zone_mid_boundary)
  # near zone: [zone_mid_boundary, runway bottom]
  # (Confirmed with the user: no separate "near edge cutoff" needed — near zone runs to the
  # runway's own bottom edge as defined by runway_left_line/runway_right_line, not a 3rd divider.)
  zone_far_boundary: null  # PLACEHOLDER — requires empirical calibration
  zone_mid_boundary: null  # PLACEHOLDER — requires empirical calibration
  t_mid_seconds: null      # PLACEHOLDER — requires empirical calibration

  # --- Low-confidence / untrusted frame handling (spec §3.5) ---
  min_detection_confidence: null  # PLACEHOLDER — requires empirical calibration
  # Frame processing latency budget is intentionally NOT a key here yet — spec §3.5/§6 says this
  # cannot be set responsibly until frame-time (capture + inference + decision) is benchmarked on
  # target hardware, since stopping distance depends on reaction time. Add it once that
  # measurement exists; until then there is no latency-based UNCERTAIN check at all (not even a
  # null one), only the always-measured-and-logged latency figure exposed for that benchmarking.

  # --- Resume logic (spec §3.6) ---
  resume_buffer_seconds: null  # PLACEHOLDER — requires empirical calibration (~2-3s starting point per spec)

# Values under `wave_facing:` are STARTING GUESSES (spec §9's suggested starting points), NOT
# calibrated values — see the Wave Gesture + Facing-Camera Gate spec (v2) §11 for the required
# empirical calibration checklist (held-still-raised-arm jitter measurement, real wave/non-wave
# footage across people/distances/lighting, etc.). They exist only so the module can be exercised
# end-to-end for the first time; treat every number below as unverified until measured. If any
# key here is later set back to null, modules.wave_facing_gate.interface.WaveFacingGateModule
# holds is_waving=False and is_facing_camera=False on every frame (both confirmation trackers
# stuck RED) — same "uncalibrated degrades to the safe/negative state, never a silent default"
# convention as emergency_stop above.
wave_facing:
  # Optional — not a threshold. Where to load MoveNet Lightning from (spec §2); defaults to the
  # official TF Hub handle, which auto-downloads and caches weights on first use. Override to
  # point at a local SavedModel directory instead.
  # movenet_tfhub_handle: "https://tfhub.dev/google/movenet/singlepose/lightning/4"

  # --- is_facing_camera (spec §3) ---
  confidence_threshold_facing: 0.3  # STARTING GUESS (spec range ~0.3-0.5) — not calibrated

  # --- Gate A: static pose gate (spec §4.1) ---
  confidence_threshold_pose: 0.3    # STARTING GUESS — wrist/elbow/shoulder confidence floor
  wrist_height_fraction: 0.5        # STARTING GUESS — upper 50% of bbox
  verticality_threshold_deg: 25     # STARTING GUESS (spec range ~20-30 deg from vertical)

  # --- Gate B: motion gate (spec §4.2) ---
  motion_window_seconds: 1.2              # STARTING GUESS (spec range ~1.0-1.5s)
  motion_confidence_threshold: 0.3        # STARTING GUESS — same as confidence_threshold_pose for now
  motion_min_samples: 5                   # STARTING GUESS — not spec-suggested, needs calibration
  motion_min_direction_changes: 2         # STARTING GUESS
  motion_direction_change_angle_deg: 90   # STARTING GUESS — sensitivity knob #1
  # Sensitivity knob #2 and the primary noise floor (spec §4.4) — MUST be calibrated from real
  # held-still-raised-arm footage on target hardware BEFORE motion_direction_change_angle_deg is
  # tuned; see the module spec's §11 calibration checklist. This is what stops MoveNet's own
  # per-frame inference jitter on a static pose from registering as spurious direction changes.
  # 8px is an UNVERIFIED guess, not a measured jitter floor — do not trust it past a first smoke
  # test; a stretch/reach held still may false-positive as waving until this is measured for real.
  motion_min_displacement_px: 8           # STARTING GUESS — REQUIRED, no verified value yet

  # --- Confirmation state machine (spec §6) ---
  confirmation_duration_seconds: 1.0  # STARTING GUESS (spec range ~1.0-2.0s)

# Camera configuration — used by main.py when --mode camera is selected, and by
# modules.followme_orchestrator's SteeringController (plans/08 §2/§3). Command-line
# --camera-index takes precedence over camera_index below.
camera:
  camera_index: 2      # OS camera device index (0 = first/default camera, usually built-in webcam)
  # fov_degrees is a fixed PHYSICAL property of the lens (not empirically tuned like other
  # thresholds in this file), but must still be set correctly from the actual hardware's spec,
  # not guessed — marked 🟢 (working-default-once-filled) rather than 🔴/🟡 for that reason. Gates
  # modules.followme_orchestrator.SteeringController: without it, horizontal_offset can never be
  # converted to a real steering angle (fail-closed, should_move forced False while tracking).
  fov_degrees: 85.0    # this project's camera hardware datasheet value
  lens_type: "hybrid"  # informational only — never consumed by any calculation
  focus_type: "fixed"  # informational only — same rationale as lens_type. Because this camera's
                        # focus is FIXED (not variable-zoom), fov_degrees is safe to treat as one
                        # constant; a variable-focus/zoom lens would need fov_degrees to become a
                        # function of zoom level instead — not this project's situation.

# PID steering gains (plans/08 §3/§4) — modules.followme_orchestrator.SteeringController converts
# target_tracking's normalized horizontal_offset into a real angle (via camera.fov_degrees above)
# then runs PID on it. All 4 keys are REQUIRED empirical/hardware values that cannot be guessed —
# while any is null, SteeringController.is_calibrated() is False and the orchestrator forces
# should_move=False even while a target is genuinely still being tracked (same fail-closed
# convention as every other module in this project).
steering:
  kp: null                          # TODO: calibrate empirically against real Ackermann hardware
  ki: null                          # TODO: calibrate empirically
  kd: null                          # TODO: calibrate empirically
  max_steering_angle_degrees: null  # TODO: set from the servo/Ackermann hardware's own datasheet limit — not a tuning target

# Human detection (optional) — feeds per-person bboxes to modules.wave_facing_gate (one
# is_waving/is_facing_camera evaluation per detected person). Not calibration-gated like
# emergency_stop/wave_facing above (no spec requires it here) — these have working defaults.
human_detection:
  # yolo_model_path: "yolo11n.onnx"  # optional override, defaults to the nano model at repo root
  confidence_threshold: 0.5  # YOLO detection confidence floor for the person class

# Face Detection + Face Matching (plans/01_face_detection_matching.md). Values below are
# STARTING GUESSES, NOT calibrated — same convention as wave_facing above: if either is later
# set back to null, modules.face_identity.interface.evaluate() returns an empty list on every
# frame (fail-closed).
face_identity:
  # yunet_model_path: "modules/face_identity/models/face_detection_yunet_2023mar.onnx"  # optional override
  # edgeface_model_path: "modules/face_identity/models/edgeface_xs_gamma_06.onnx"        # optional override
  # registry_dir: "modules/face_identity/registry_data"                                  # optional override
  similarity_threshold_face_match: 0.4        # STARTING GUESS — EdgeFace's own reference demo's default threshold
  face_detection_confidence_threshold: 0.6    # STARTING GUESS — standard YuNet starting point

# Human Detection, ROI-scoped (plans/02_human_detection_roi.md). Flow: Face -> ROI (derived from
# face bbox size * roi_expansion_factor) -> Human detection inside that ROI, to tighten the crop
# fed to the detector. Human detection is only ever triggered once a face has already been
# matched — it never runs independently of a face match. No persistent track_id: the ROI crop
# shifts every frame (it follows wherever the face currently is), which isn't a stable enough
# coordinate frame for tracker-style persistence (confirmed with the user). Values below are
# STARTING GUESSES, NOT calibrated — if either key is later set back to null,
# modules.human_detection_roi.interface.evaluate() reports person_found=False on every call
# (fail-closed), same convention as face_identity above.
human_detection_roi:
  # yolo_model_path: "yolo11n.onnx"  # optional override, defaults to the nano model at repo root
  # ROI expansion strategy (spec §2): downward/lateral-biased — most of the expansion goes below
  # the face (body extends down, not up).
  roi_expansion_factor: 10.0            # STARTING GUESS (spec suggests starting ~4-6x face bbox height) — not calibrated
  # Tunable up/down/width split of roi_expansion_factor's budget (see roi.py) — working defaults
  # below, uncomment to override. roi_upward_fraction: share of the height budget above the face
  # (rest goes below); roi_width_fraction: ROI width as a fraction of face_w * roi_expansion_factor.
  roi_upward_fraction: 0.04   # default — ~5% of the height budget goes up, ~95% down
  roi_width_fraction: 0.8     # default — width = face_w * roi_expansion_factor * 0.6
  detection_confidence_threshold: 0.5  # STARTING GUESS — standard YOLO starting point

# Gesture Detection — Method 2, Hand Keypoint (plans/03_gesture_hand_keypoint.md). REDESIGNED —
# no longer motion-based. Pure hand-shape sequence classification, MediaPipe landmark geometry
# only (no wrist motion, no trajectory, no arm geometry). Valid gesture = OPEN -> CLOSED -> OPEN
# -> CLOSED, each transition within max_transition_gap_seconds of the last, starting from OPEN.
# Every OPEN/CLOSED read must also independently clear the palm_height_fraction gate (palm/wrist
# in the upper fraction of the person's FULL-FRAME bbox from modules.human_detection_roi) —
# failing that gate is an immediate reset to WAITING_OPEN, confirmed with the user. Only ONE hand
# drives the sequence per frame — whichever confident hand clears the height gate (highest
# confidence if more than one), Left/Right side ignored entirely. CONFIRMED (sequence complete)
# feeds the shared RED/YELLOW/GREEN confirmation tracker exactly as before.
# One of three interchangeable, independently-implemented gesture methods (see also
# modules.wave_facing_gate = Method 1, and gesture_trajectory_verifier below = Method 3) — none
# share config values. Values below are STARTING GUESSES, NOT calibrated — if any key is later
# set back to null, is_waving stays False on every call (fail-closed); hand detection/keypoints
# still run and are visualizable regardless of calibration state.
gesture_hand_keypoint:
  # model_path: "modules/gesture_hand_keypoint/models/hand_landmarker.task"  # optional override
  confidence_threshold: 0.5                 # STARTING GUESS — MediaPipe handedness/detection confidence floor
  # min_fingers_extended_open / min_fingers_curled_closed are both scored out of the 4 NON-THUMB
  # fingers only. OPEN additionally requires the thumb to independently pass
  # thumb_extension_ratio_threshold. CLOSED does NOT check the thumb at all — a natural fist
  # rests the thumb over the curled fingers (not tucked into the palm), so the thumb's
  # distance-based extension test does not reliably read "curled" for a real fist; requiring it
  # would false-negative on a completely normal fist pose.
  min_fingers_extended_open: 4              # STARTING GUESS — of 4 non-thumb fingers, how many extended (+ thumb extended) = OPEN
  min_fingers_curled_closed: 4              # STARTING GUESS — of 4 non-thumb fingers, how many curled = CLOSED (fist); thumb ignored
  # Thumb extension test (confirmed with the user): distance(thumb_tip, pinky_MCP), normalized
  # by hand scale (distance(wrist, middle_MCP)), must exceed this ratio to count as extended.
  # Large when the thumb sticks out away from the hand (open); small when tucked toward the palm.
  # Only gates OPEN — see above.
  thumb_extension_ratio_threshold: 0.6      # STARTING GUESS — unverified, calibrate against real open/fist footage
  # Palm-height gate (confirmed with the user: landmark 0 / wrist, measured against the FULL-FRAME
  # person bbox from modules.human_detection_roi, not just the hand-crop). Every OPEN/CLOSED read
  # counted toward the sequence must independently clear this — failing it resets the sequence
  # immediately (confirmed with the user), stricter than a merely non-advancing frame. Also acts
  # as the selector for which hand drives the sequence when more than one hand is visible.
  palm_height_fraction: 0.5                 # STARTING GUESS — upper 50% of the person's bbox
  # Timeout between consecutive sequence transitions (spec: no partial credit past this gap).
  max_transition_gap_seconds: 1.5           # STARTING GUESS (spec suggests starting ~1-2s)
  confirmation_duration_seconds: 1.0        # STARTING GUESS, independently tunable from Methods 1/3

# Gesture Detection — Method 3, Trajectory Verifier (plans/04_gesture_trajectory_verifier.md).
# Tracks wrist+elbow+shoulder for one arm at a time (both computed, best score wins), compares
# via fixed-length TIME-BASED resampling (confirmed with the user, spec §2.3) + cosine similarity
# against a small SHARED, GENERIC reference trajectory set (not per-person, spec §4). Reuses only
# the MoveNet Lightning MODEL from Method 1 — no shared code/classes (spec §0.3).
gesture_trajectory_verifier:
  # movenet_tfhub_handle: "https://tfhub.dev/google/movenet/singlepose/lightning/4"  # optional override
  # reference_dir: "modules/gesture_trajectory_verifier/reference_trajectories"       # optional override
  confidence_threshold: 0.6           # TODO: calibrate (per-keypoint MoveNet confidence floor, all of wrist/elbow/shoulder must clear it)
  trajectory_window_seconds: null      # TODO: calibrate, independently tunable from Method 1's motion_window_seconds
  min_samples_for_comparison: 3     # TODO: calibrate
  resample_length: 20                # TODO: calibrate (spec suggests starting ~20 points)
  similarity_threshold: null           # TODO: calibrate (spec suggests starting ~0.7-0.85)
  confirmation_duration_seconds: null  # TODO: calibrate, independently tunable from Methods 1/2
  # Reference-set "not ready" floor (spec §4.3, confirmed with the user: 0 or 1 references both
  # count as not-ready) is a fixed structural rule (MIN_REFERENCE_COUNT=2 in config.py), not a
  # per-project calibration value — not a key here by design.

# Appearance Verifier — OSNet Re-ID (plans/05_appearance_verifier.md). Answers "does this crop
# look like the same person as this reference set" — consumed by modules.target_tracking
# (periodic re-verify sanity check) and modules.target_recovery (fallback re-acquisition), each
# with their OWN separate threshold key, not this one (see those modules' sections below).
# similarity_threshold is ESPECIALLY uncalibrated — two documented accuracy risks (similar-
# clothing confusion, cross-domain generalization drop from OSNet's Market1501 training data to
# this project's own campus footage) make a "starting guess" here less trustworthy than usual —
# see docs/parameters.md and docs/modules.md for both risks in full. Fail-closed as usual: while
# null, verify() reports match_found=False on every call.
appearance_verifier:
  similarity_threshold: null   # TODO: calibrate — especially uncalibrated, see note above
  # osnet_model_name: "osnet_x1_0"  # optional override — not calibration-gated, working default

# Target Recording + Tracking (plans/06_target_tracking.md). Locks onto the person the gesture
# trigger identified, records a short appearance reference set, then tracks them frame-to-frame
# via this module's own isolated YOLO+ByteTrack instance, reporting horizontal deviation from
# frame-center for downstream steering. Hands off to target_recovery on LOST. All keys below
# require empirical calibration (STARTING GUESSES / uncalibrated, per this module's spec §6).
target_tracking:
  record_duration_seconds: null                    # TODO: calibrate — spec suggests ~1-2s to start
  min_recording_crops: 3                            # STARTING GUESS — below this, RECORDING extends rather than transitioning with a fragile reference set (confirmed with the user)
  appearance_reverify_interval_seconds: null        # TODO: calibrate — how often the periodic ID-switch sanity check runs
  appearance_reverify_similarity_threshold: null    # TODO: calibrate — deliberately its OWN key, independent from appearance_verifier.similarity_threshold (see that module's §4)
  appearance_reverify_consecutive_failures: 2       # STARTING GUESS — confirmed with the user: 2 consecutive failed re-verifies before declaring LOST, not 1 (avoids a single bad-lighting frame triggering a full recovery cycle)
  track_loss_grace_period_seconds: null             # TODO: calibrate — how long the locked track_id may be missing from ByteTrack's output before declaring LOST
  # yolo_model_path: "yolo11n.onnx"  # optional override, own independent instance per isolation rule

# Target Recovery / Search (plans/07_target_recovery.md). Takes over when target_tracking reports
# LOST — searches the full frame via face-based re-acquisition first (Path A, primary), falling
# back to appearance-based matching (Path B) only after face_search_grace_attempts consecutive
# Path-A failures. All keys require empirical calibration.
target_recovery:
  face_search_grace_attempts: null       # TODO: calibrate — a COUNT of consecutive Path-A-failure frames, NOT a time duration (see this module's spec §4.2 for why)
  appearance_fallback_threshold: null    # TODO: calibrate — deliberately its OWN key, independent from appearance_verifier.similarity_threshold and target_tracking.appearance_reverify_similarity_threshold
  search_timeout_seconds: null           # TODO: calibrate — spec suggests ~1-2 minutes as a starting range
  # yolo_model_path: "yolo11n.onnx"  # optional override, own independent instance for Path B's whole-frame detection

# Vendored tracking+recovery backbone (modules/autocar — vinhh9608-byte/Autocar, commit 27ee33a),
# slated to replace target_tracking + target_recovery above once wired in and confirmed working
# (see modules/autocar/README.md and the project's own integration plan — module stays named
# "autocar" until that happens, then this section renames to target_tracking too). Their engine
# (detector/, tracker/, identity/, config.py) is kept UNMODIFIED per that decision; every value
# below is only ever read by the NEW adapter code we write in modules/autocar/interface.py +
# pipeline.py (not yet built) and passed into their classes' own constructor overrides — their
# vendored config.py is never edited.
#
# Detector/tracker/re-id values are carried over as-is from their own config.py — those are
# their own considered starting points, not values we invented, so treated as STARTING GUESSES
# (same status as this project's other uncalibrated defaults) rather than blind guesses.
# recovery_timeout_seconds has no equivalent in their code (their ACQUIRING phase retries
# forever, no timeout) — TODO per this project's fail-closed convention: while null, the adapter
# must not let a lost target search indefinitely without ever reporting back to
# modules.followme_orchestrator (mirrors target_recovery.search_timeout_seconds above).
autocar:
  # --- Detector (their detector/yolov8_pose_torch.py) ---
  detect_conf: 0.4              # STARTING GUESS, carried from their config.py DETECT_CONF
  detect_imgsz: 300              # STARTING GUESS, carried from their config.py DETECT_IMGSZ
  # pose_model_path: "yolov8n-pose.pt"  # optional override, auto-downloaded by ultralytics like our own weights

  # --- Tracker (their tracker/byte_tracker.py) ---
  track_high_thresh: 0.6         # STARTING GUESS, carried from their config.py TRACK_HIGH_THRESH
  track_low_thresh: 0.1          # STARTING GUESS, carried from their config.py TRACK_LOW_THRESH
  new_track_thresh: 0.7          # STARTING GUESS, carried from their config.py NEW_TRACK_THRESH
  match_thresh: 0.8              # STARTING GUESS, carried from their config.py MATCH_THRESH
  low_match_thresh: 0.5          # STARTING GUESS, carried from their config.py LOW_MATCH_THRESH
  track_buffer: 30               # STARTING GUESS, carried from their config.py TRACK_BUFFER

  # --- Re-ID / TargetLock (their identity/target_lock.py) ---
  reid_similarity_threshold: 0.75        # STARTING GUESS, carried from their config.py REID_SIMILARITY_THRESHOLD — ESPECIALLY uncalibrated, same OSNet accuracy caveats as appearance_verifier above
  reid_face_min_keypoint_conf: 0.5       # STARTING GUESS, carried from their config.py REID_FACE_MIN_KEYPOINT_CONF
  reid_head_split_fallback_fraction: 0.35  # STARTING GUESS, carried from their config.py REID_HEAD_SPLIT_FALLBACK_FRACTION
  reid_acquire_rounds: 3                 # STARTING GUESS, carried from their config.py REID_ACQUIRE_ROUNDS — only used on initial force-lock IoU fallback, not the normal trigger path
  reid_acquire_cooldown_sec: 0.5         # STARTING GUESS, carried from their config.py REID_ACQUIRE_COOLDOWN_SEC
  # reid_model_path: "modules/autocar/models/osnet_x1_0_msmt17.onnx"  # optional override — file must exist; see modules/autocar/README.md

  # --- Ours, not theirs (closes the "search forever" gap noted above) ---
  recovery_timeout_seconds: null  # TODO: calibrate — spec-equivalent to target_recovery.search_timeout_seconds above
